name: "Create image tag"
description: "Read Version from Directory.Build.props and combine with build number"

inputs:
  build-number:
    description: "CI build number"
    required: true

outputs:
  image_tag:
    description: "Docker image tag (Version-build.build_number)"
    value: ${{ steps.set_tag.outputs.image_tag }}

runs:
  using: "composite"
  steps:
    - id: set_tag
      shell: bash
      run: |
        VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
        if [ -z "$VERSION" ]; then
          echo "Version not found in Directory.Build.props"
          exit 1
        fi

        IMAGE_TAG="${VERSION}-build.${{ inputs.build-number }}"
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "Docker image tag: $IMAGE_TAG"
